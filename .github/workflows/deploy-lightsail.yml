name: Deploy to Lightsail

# Builds the image and redeploys it, keeping the environment variables, port
# and health check already configured on the Lightsail container service.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: lightsail-deploy

env:
  AWS_REGION: us-east-1
  SERVICE: whatsapp-reminders

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install lightsailctl
        run: |
          sudo curl -fsSL https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Build image
        run: docker build -t app:latest .

      - name: Push image
        id: push
        run: |
          out=$(aws lightsail push-container-image --service-name "$SERVICE" --label app --image app:latest)
          echo "$out"
          image=$(echo "$out" | grep -o ":$SERVICE\.app\.[0-9]*" | tail -1)
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy with current settings
        id: deploy
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          aws lightsail get-container-services --service-name "$SERVICE" \
            --query 'containerServices[0].currentDeployment' > current.json
          if [ "$(jq -r '.containers // empty' current.json)" = "" ]; then
            echo "No active deployment yet. Image $IMAGE is registered; create the first deployment manually."
            exit 0
          fi
          jq --arg img "$IMAGE" '.containers |= with_entries(.value.image = $img)' current.json > next.json
          aws lightsail create-container-service-deployment --service-name "$SERVICE" \
            --containers "$(jq -c .containers next.json)" \
            --public-endpoint "$(jq -c .publicEndpoint next.json)" > /dev/null
          echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        if: steps.deploy.outputs.started == 'true'
        run: |
          for i in $(seq 1 60); do
            state=$(aws lightsail get-container-service-deployments --service-name "$SERVICE" \
              --query 'deployments[0].state' --output text)
            echo "deployment state: $state"
            case "$state" in
              ACTIVE) exit 0 ;;
              FAILED) echo "Deployment failed; previous version is still serving."; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for deployment"; exit 1
